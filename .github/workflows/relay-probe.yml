# Temporary isolated probe: proves GITHUB_TOKEN can dispatch exactly one
# successor. It never installs dependencies, opens a database, or trades.
name: relay permission probe
on:
  workflow_dispatch:
    inputs:
      hop:
        description: "0 dispatches one successor; 1 terminates the probe"
        required: true
        default: "0"
permissions:
  contents: read
  actions: write
concurrency:
  group: paper-trader-relay-permission-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check bounded hop
        env:
          HOP: ${{ github.event.inputs.hop }}
        run: |
          echo "probe hop ${HOP:-0}"
          [ "${HOP:-0}" = "0" ] || [ "$HOP" = "1" ]
      - name: Dispatch one successor
        if: github.event.inputs.hop != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/actions/workflows/relay-probe.yml/dispatches" \
            -d '{"ref":"main","inputs":{"hop":"1"}}'
      - name: Terminal hop reached
        if: github.event.inputs.hop == '1'
        run: echo "Built-in-token successor dispatch worked; no further hop dispatched."
