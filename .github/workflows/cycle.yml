# The trading half of the free stack.
#
# The web host (Render's free tier) sleeps when nobody visits and loses its disk
# whenever it restarts, so the trading loop cannot live there. This workflow is
# the loop: GitHub starts run_cycle_job.py, which then keeps cycling by itself
# until the US session closes.
#
# Why a cron AND a loop: GitHub's cron is best-effort and would only fire a few
# times a day, far too rarely for a 15-minute rescan. So each trigger stays alive
# for up to five hours, cycling once per due interval, and the next trigger takes
# over. Between them the market is covered continuously.
#
# Outside the session (Mon-Fri 09:30-16:00 ET) the job stops before it touches
# the database: no scan, no feed entry, no order. Closed-market runs are green,
# not failures.
#
# Setup (once):
#   1. Add the repository secret DATABASE_URL - the PostgreSQL connection
#      string from Neon/Supabase.
#   2. Add the repository secret WEB_URL - the Render URL of the dashboard,
#      e.g. https://paper-trader.onrender.com (used for the keep-alive ping;
#      leave it out and the ping step simply does nothing).
#   3. Enable Actions if the repository is forked (schedules are off by default
#      in forks).
#
# Notes that matter for a trading job:
#   * The cron below fires only on weekdays around the US session, in UTC. US
#     clock changes shift the session by an hour twice a year; the job's own
#     market gate is what actually decides, so this window is deliberately wide.
#   * `concurrency` plus the app's own PostgreSQL advisory lock means two runs
#     can never trade at the same time. A run that finds the lock held skips
#     instead of trading twice.
#   * A failing cycle makes this run fail, so a broken engine is visible instead
#     of silent.

name: paper-trader cycle

on:
  schedule:
    # 13:00-21:45 UTC, Monday to Friday. In summer that is 09:00-17:45 ET and in
    # winter 08:00-16:45 ET, so the US regular session is covered with an hour of
    # slack on either side whichever way the clocks have moved. Triggers outside
    # the session are cheap green no-ops thanks to the job's own market gate.
    - cron: "*/15 13-21 * * 1-5"
    # Safety net for GitHub's unreliable timer. A scheduled workflow can be
    # delayed or dropped, and if the day's triggers all land before the opening
    # bell the session would be missed. These hourly morning triggers arrive
    # before the bell on purpose: the job waits for 09:30 ET (up to four hours)
    # and then trades the session, so an early trigger still produces a full
    # day of cover. The concurrency group turns the extra triggers into a relay.
    - cron: "0 10-12 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "loop = keep cycling until the market closes; once = one cycle"
        type: choice
        options: [loop, once]
        default: loop
      every_seconds:
        description: "how often the loop re-checks whether a portfolio is due"
        default: "60"
      max_hours:
        description: "give up the loop after this many hours (GitHub kills a job at 6)"
        default: "5"
      ignore_market_hours:
        description: "run even when the US session is closed (testing only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paper-trader-cycle
  cancel-in-progress: false

jobs:
  cycle:
    # Pinned to an LTS image deliberately: GitHub moves `ubuntu-latest` to
    # Ubuntu 26 on 19 October 2026, and a trading job should not change
    # underneath itself. Bump this on purpose, not automatically.
    runs-on: ubuntu-24.04
    # Long enough for the loop to cover a whole session, short enough that this
    # ends well before GitHub's hard 6-hour limit.
    timeout-minutes: 350

    env:
      # Shows up in the dashboard's activity feed as the source of the cycle.
      PAPER_TRADER_JOB: "GitHub Actions"
      MODE: ${{ github.event.inputs.mode }}
      EVERY_SECONDS: ${{ github.event.inputs.every_seconds }}
      MAX_HOURS: ${{ github.event.inputs.max_hours }}
      IGNORE_MARKET_HOURS: ${{ github.event.inputs.ignore_market_hours }}

    steps:
      # v7 of both actions: v4/v5 still run on Node 20, which GitHub is retiring.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-postgres.txt

      - name: Run trading cycles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Empty on scheduled runs, where the job falls back to its defaults.
          PAPER_TRADER_EVERY_SECONDS: ${{ github.event.inputs.every_seconds }}
          PAPER_TRADER_MAX_HOURS: ${{ github.event.inputs.max_hours }}
        run: |
          FLAGS="--json"
          if [ "$MODE" != "once" ]; then
            FLAGS="$FLAGS --loop"
          fi
          if [ "$IGNORE_MARKET_HOURS" = "true" ]; then
            FLAGS="$FLAGS --ignore-market-hours"
          fi
          echo "python run_cycle_job.py $FLAGS"
          python run_cycle_job.py $FLAGS

      - name: Keep the dashboard awake
        # Render's free web service sleeps after ~15 minutes of inactivity. This
        # ping wakes it and keeps it warm. It is deliberately non-fatal: the
        # trading cycles above have already done the work.
        continue-on-error: true
        env:
          WEB_URL: ${{ secrets.WEB_URL }}
        run: |
          if [ -n "$WEB_URL" ]; then
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" "$WEB_URL/api/health" || true)
              echo "attempt $attempt: HTTP $code"
              [ "$code" = "200" ] && break
              sleep 20
            done
          else
            echo "WEB_URL is not set - skipping the keep-alive ping."
          fi
