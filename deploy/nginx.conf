# nginx reverse proxy for the paper trader.
#
# The app listens on 127.0.0.1:8080 and speaks plain HTTP. TLS must be
# terminated here: the login cookie is a bearer credential, so plain HTTP over
# the open internet would hand it to anyone on the path.
#
# Install (Debian/Ubuntu):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/paper-trader
#   sudo ln -s /etc/nginx/sites-available/paper-trader /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d trader.example.com        # free auto-renewing TLS
#
# Replace trader.example.com with your domain in both places below.

# --- HTTP: only used to get the certificate and to redirect -------------
server {
    listen 80;
    listen [::]:80;
    server_name trader.example.com;
    return 301 https://$host$request_uri;
}

# --- HTTPS --------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name trader.example.com;

    # Managed by certbot; adjust if you place your own certificates.
    ssl_certificate     /etc/letsencrypt/live/trader.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trader.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The API only ever receives small JSON bodies (1 MB is the app's own cap).
    client_max_body_size 1m;

    # Login throttling happens in the app as well; this is a cheap outer guard.
    limit_req_zone $binary_remote_addr zone=paper_login:10m rate=20r/m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # The dashboard polls /api/state every 5 s from the same origin, and loads
    # exactly one stylesheet and one script from it.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    location = /api/login {
        limit_req zone=paper_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/paper-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/paper-proxy.conf;
    }

    # Uptime monitors / Docker health checks can use this one anonymously.
    location = /api/health {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/paper-proxy.conf;
        access_log off;
    }
}
