# Shared proxy headers, included by every location in deploy/nginx.conf.
#
# Install:
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/paper-proxy.conf /etc/nginx/snippets/paper-proxy.conf

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# A 5 s polling dashboard plus occasional multi-second API calls; keep the
# upstream connection alive between polls so each poll is not a new TCP
# handshake.
proxy_set_header Connection        "";
proxy_buffering off;

# A Trading Mode cycle can take ~60 s and the AI analysis minutes. /api/state
# and the engine endpoints answer immediately (the work happens on background
# threads), so these generous timeouts only matter for /api/models, which
# waits for Ollama to list models.
proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;
